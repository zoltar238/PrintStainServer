spring.application.name=PrintStainServer
#####################
#      LOGGING      #
#####################
#logging.level.root=DEBUG
logging.level.com.github.zoltar238.PrintStainServer=DEBUG
logging.level.org.springframework.security=TRACE
logging.file.path=logs/printstain.log
#####################
# DATABASE SETTINGS #
#####################
# Hibernate
spring.jpa.hibernate.naming.physical-strategy=com.github.zoltar238.PrintStainServer.persistence.config.CustomPhysicalNamingStrategy
spring.datasource.url=jdbc:postgresql://localhost:5432/printstain
spring.datasource.username=printstain
spring.datasource.password=printstain
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Enables hibernate lazy initialization
spring.jpa.open-in-view=true
# Hikari connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
#####################
#      STORAGE      #
#####################
# Images storage location
image.storage.location=/home/andrei/IdeaProjects/PrintStainServer/src/main/resources/images
# Downloads storage location
downloads.storage.location=/home/andrei/IdeaProjects/PrintStainServer/src/main/resources/downloads
# File downloading settings
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
# Disables springboot lazy initialization
spring.main.lazy-initialization=false
