spring.application.name=PrintStainServer
#####################
#      LOGGING      #
#####################
#logging.level.root=DEBUG
logging.level.com.github.zoltar238.PrintStainServer=DEBUG
logging.level.org.springframework.security=TRACE
logging.file.path=logs/printstain.log
#####################
# DATABASE SETTINGS #
#####################
# H2 test database
spring.jpa.hibernate.naming.physical-strategy=com.github.zoltar238.PrintStainServer.persistence.config.CustomPhysicalNamingStrategy
spring.datasource.url=jdbc:h2://mem:db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# Enables hibernate lazy initialization
spring.jpa.open-in-view=true
# Hikari connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
#####################
#      STORAGE      #
#####################
# Images storage location
storage.base-dir=${user.home}/printstain/data
image.storage.location=${storage.base-dir}/images/
downloads.storage.location=${storage.base-dir}/downloads/
# File downloading settings
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
# Disables springboot lazy initialization
spring.main.lazy-initialization=false
